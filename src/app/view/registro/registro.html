<div class="contenedor">
  <mat-card class="card">
    <h2>Registrar Nadador</h2>

    <form #form="ngForm" (ngSubmit)="guardar()" class="formulario">

      <mat-form-field appearance="outline" class="full">
        <mat-label>Nombre</mat-label>
        <input matInput [(ngModel)]="name" name="name" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Documento</mat-label>
        <input matInput [(ngModel)]="document" name="document" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Fecha de nacimiento</mat-label>
        <input matInput type="date" [(ngModel)]="birth_date" name="birth_date" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Género</mat-label>
        <mat-select [(ngModel)]="gender" name="gender" required>
          <mat-option value="male">Masculino</mat-option>
          <mat-option value="female">Femenino</mat-option>
          <mat-option value="other">Otro</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="email" name="email">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password" required minlength="6">
        <mat-hint>Mínimo 6 caracteres</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Confirmar contraseña</mat-label>
        <input matInput type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Teléfono</mat-label>
        <input matInput [(ngModel)]="phone" name="phone">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Categoría</mat-label>
        <mat-select [(ngModel)]="category" name="category">
          <mat-option value="">Sin categoría</mat-option>
          <mat-option value="kids">Kids</mat-option>
          <mat-option value="youth">Youth</mat-option>
          <mat-option value="senior">Senior</mat-option>
          <mat-option value="master">Master</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="botones">
        <button mat-stroked-button type="button" (click)="cancelar()" [disabled]="guardando">
          Cancelar
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="guardando || form.invalid">
          {{ guardando ? 'Guardando...' : 'Registrar' }}
        </button>
      </div>

    </form>
  </mat-card>
</div>
