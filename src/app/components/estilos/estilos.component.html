<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  >
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item href="/Usuario">Usuarios</a>
      <a mat-list-item href="/Accesorios">Accesorios</a>
      <a mat-list-item href="/Competitions">Competitions</a>
      <a mat-list-item href="/Formulario">Formulario</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar style="background-color: rgb(199, 199, 255);">
      @if (isHandset$ | async) {
        <button type="button" aria-label="Toggle sidenav" matIconButton (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <span>Blue Wave</span>

      <!-- AVATAR CON MENÚ DESPLEGABLE -->
      @if (authService.currentUser()) {
        <button
          mat-icon-button
          [matMenuTriggerFor]="userMenu"
          style="margin-left: auto;"
          aria-label="Menú de usuario">

          <hub-avatar
            [name]="authService.currentUser()?.name"
            size="40">
          </hub-avatar>
        </button>

        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Cerrar sesión</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
